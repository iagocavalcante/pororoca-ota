name: Bug report
description: Report something that isn't working as expected.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - SwiftUI SDK
        - Compose SDK
        - Publisher CLI
        - MCP
        - Hosted control plane (pororoca-ota.fly.dev)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Pinned commit, tag, or package version you're using.
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Do not paste API tokens, signing private keys, or other secrets.
      render: shell
    validations:
      required: false
