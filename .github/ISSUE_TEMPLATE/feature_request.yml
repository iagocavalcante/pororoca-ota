name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - SwiftUI SDK
        - Compose SDK
        - Publisher CLI
        - MCP
        - Hosted control plane (pororoca-ota.fly.dev)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The gap or friction you're hitting today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
